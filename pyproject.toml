[project]
name = "pitwall"
version = "0.1.0"
description = "F1 2026 strategy and telemetry platform: lakehouse, tyre models and race simulation. Unofficial project, not affiliated with Formula 1."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
# Dagster is large, so it lives in its own extra. The Docker image and CI install it.
orchestration = [
    "dagster>=1.8,<2.0",
    "dagster-webserver>=1.8,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
pitwall-record-fixtures = "pitwall.ingestion.record_fixtures:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
    "D",        # docstrings
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dagster.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=pitwall --cov-report=term-missing --cov-fail-under=70"
markers = [
    "integration: hits the real network; skipped unless PITWALL_RUN_INTEGRATION=1",
]

[tool.coverage.run]
branch = true
source = ["pitwall"]
